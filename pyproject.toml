[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-i"
version = "0.2.0.dev0"
description = "Like `claude -p`, but driven through an interactive Claude Code session."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "rafaelscosta" },
]
keywords = ["claude", "cli", "tmux", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]
# Runtime dependencies: none. All deps are stdlib + external binaries (tmux, claude).
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4.0",
    "mypy>=1.8",
]

[project.scripts]
claude-i = "claude_i.cli:main"

[project.urls]
Homepage = "https://github.com/rafaelscosta/claude-i"
Repository = "https://github.com/rafaelscosta/claude-i"
Issues = "https://github.com/rafaelscosta/claude-i/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_i"]

[tool.hatch.build.targets.sdist]
include = [
    "src/claude_i",
    "tests",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # ruff-specific
    "S306", # bandit: tempfile.mktemp() insecure (G5 regression guard — story spec'd "S322" which is the upstream bandit code; ruff translates it to S306)
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/claude_i"]
show_error_codes = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
