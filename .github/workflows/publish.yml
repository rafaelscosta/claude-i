# PyPI Publish Workflow — Trusted Publishing (OIDC)
#
# Public-release status (2026-05-19+): the claude-i repository is PUBLIC and
# PyPI publication is AUTHORIZED but still gated on the operator configuring
# the PyPI Trusted Publisher. See NOTES.md § IP Status — Public Release.
#
# This workflow remains in the repo as future-proof infrastructure but is
# guarded by a required confirmation string input that makes accidental
# dispatch IMPOSSIBLE. Even an operator clicking "Run workflow" in the
# GitHub UI cannot publish without typing the exact 49-character
# confirmation token.
#
# Tag-triggered auto-publish (`on: push: tags: [v*.*.*]`) is deliberately
# OMITTED — re-enabling it would bypass the confirm_release input guard.
# DO NOT add a push:tags trigger without first updating NOTES.md
# § IP Status — Public Release and the PyPI trusted-publishing guide.
#
# Trigger: workflow_dispatch only, with mandatory confirm_release string.
#
# Requirements (one-time, operator):
#   1. PyPI Pending Publisher configured for repository=rafaelscosta/claude-i,
#      workflow=publish.yml, environment=publish (see
#      docs/guides/pypi-trusted-publishing.md).
#   2. GitHub 'publish' environment already created in repo Settings →
#      Environments (done 2026-05-18 via `gh api`, restricted to main
#      branch + v*.*.* tags).
#
# No long-lived API secrets are referenced — authentication is exclusively via
# OIDC (id-token: write permission below).

name: publish

on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: |
          MUST be exactly: I-CONFIRM-PUBLIC-PERMANENT-PYPI-RELEASE

          ⚠️ Publishing makes the wheel + sdist available on pypi.org WORLDWIDE.
          The sdist contains src/. PyPI versions are PERMANENT.

          Publishing is authorized by NOTES.md § IP Status — Public Release,
          but should run only after the PyPI Trusted Publisher is configured
          and the current release version is intended for public PyPI.
        required: true
        type: string

permissions:
  contents: read
  id-token: write  # Required for PyPI Trusted Publishing (OIDC)

jobs:
  publish-to-pypi:
    name: build + publish to PyPI
    runs-on: ubuntu-latest
    environment: publish

    steps:
      - name: Safety guard — confirm release string
        run: |
          if [ "${{ inputs.confirm_release }}" != "I-CONFIRM-PUBLIC-PERMANENT-PYPI-RELEASE" ]; then
            echo "❌ Safety guard FAILED."
            echo "Provided: '${{ inputs.confirm_release }}'"
            echo "Required: 'I-CONFIRM-PUBLIC-PERMANENT-PYPI-RELEASE'"
            echo ""
            echo "This workflow PERMANENTLY publishes claude-i to public PyPI."
            echo "Run only after PyPI Trusted Publisher setup is complete."
            echo ""
            echo "If you intend to publish the current release:"
            echo "  1. Confirm NOTES.md § IP Status — Public Release is current"
            echo "  2. Confirm PyPI Trusted Publisher points at workflow=publish.yml and environment=publish"
            echo "  3. Re-run with confirm_release set EXACTLY as documented"
            exit 1
          fi
          echo "✓ Confirmation string verified. Proceeding with PyPI publish."

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist + wheel
        run: python -m build

      - name: List artifacts
        run: ls -la dist/

      - name: Publish to PyPI (Trusted Publishing / OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        # No password parameter — OIDC is the only auth path. The action
        # mints a short-lived token from the GitHub OIDC provider and
        # exchanges it with pypi.org's Trusted Publisher endpoint.
